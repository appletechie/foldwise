[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "foldwise"
version = "0.1.0"
description = "Local-first file organizer that learns your folder tree"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "laya>=0.3.20,<0.4",
    "mcp>=2.2,<3",
    "anyio>=4",  # the anyio-marked MCP test imports it directly
    "torch>=2.2",  # train/loop.py and the slow test import torch directly
    "transformers>=4.38",  # the train command builds the tokenizer directly
    "huggingface-hub>=0.20",  # the train command downloads the base checkpoint directly
    "safetensors>=0.4",  # train/loop.py saves with safetensors.torch directly
    "typer>=0.27",
    "rich>=13",
    "pyyaml>=6",
    "platformdirs>=4",
    "pypdf>=6",
]

[project.optional-dependencies]
mac = ["pyobjc-framework-Vision>=12", "pyobjc-framework-Quartz>=12"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
foldwise = "foldwise.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/foldwise"]

[tool.pytest.ini_options]
markers = ["slow: trains a real model; run with -m slow"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
